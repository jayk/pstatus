<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{PAGE_TITLE}}</title>
  <style>{{STYLES}}</style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>{{PAGE_TITLE}} <span>Cross-project status dashboard</span></h1>
    </header>
    <div id="controls">
      <input id="search" aria-label="Search" placeholder="Search">
      <div class="filter-row">
        <div class="eta-controls">
          <span>ETA:</span>
          <button data-eta="">Any</button>
          <button data-eta="60">&lt;= 1h</button>
          <button data-eta="120">&lt;= 2h</button>
          <button data-eta="240">&lt;= 4h</button>
        </div>
        <div class="toggle-group">
          <label class="toggle"><input id="hide-empty" type="checkbox" checked> Hide empty projects</label>
          <label class="toggle"><input id="done" type="checkbox"> Show completed items</label>
        </div>
      </div>
      <p id="error" role="alert"></p>
    </div>
    <div class="board-chrome">
      <div id="board-indicator-left" class="board-indicator" aria-hidden="true">&#x2190;</div>
      <div id="board-indicator-right" class="board-indicator" aria-hidden="true">&#x2192;</div>
      <p id="board-empty" class="board-empty">No matching items.</p>
      <div id="board" class="hide-empty-projects"></div>
    </div>
  </main>
  <dialog id="modal"></dialog>
  <template id="template-column">
    <section class="column">
      <h2 class="column-title"></h2>
      <div class="column-body"></div>
    </section>
  </template>
  <template id="template-card">
    <button class="card" type="button">
      <b class="card-status"></b>
      <span class="card-title"></span>
      <div class="card-progress-slot"></div>
      <span class="card-footer">
        <small class="card-label"></small>
        <small class="card-eta"></small>
      </span>
    </button>
  </template>
  <template id="template-progress">
    <div class="progress-wrap">
      <div class="progress-label"></div>
      <div class="progress"><span></span></div>
    </div>
  </template>
  <template id="template-empty-column">
    <p class="empty">No matching items.</p>
  </template>
  <template id="template-detail">
    <div class="detail-root">
      <button id="close" aria-label="Close details">&times;</button>
      <header class="detail-header">
        <div class="detail-title-block">
          <p class="detail-status"></p>
          <h2 class="detail-title"></h2>
        </div>
        <div class="detail-eta"></div>
      </header>
      <div class="detail-meta">
        <p class="detail-project"><b>Project:</b> <span class="detail-project-name"></span> <span class="detail-label"></span></p>
        <p class="detail-date"><b>Date:</b> <span class="detail-date-value"></span></p>
      </div>
      <div class="detail-progress-slot"></div>
      <dl class="detail-metadata"></dl>
      <section class="checklist detail-checklist">
        <h3>Checklist</h3>
        <ul></ul>
      </section>
      <article class="detail-body"></article>
      <p class="source"><b>Source:</b> <span class="detail-source-file"></span>:<span class="detail-source-line"></span></p>
    </div>
  </template>
  <template id="template-checklist-item">
    <li>
      <span class="mark"></span>
      <span class="checklist-text"></span>
    </li>
  </template>
  <template id="template-metadata-item">
    <div class="metadata-pill">
      <span class="metadata-key"></span>
      <span class="metadata-sep">:</span>
      <span class="metadata-value"></span>
    </div>
  </template>
  <template id="template-detail-eta">
    <div class="detail-eta-inner">
      <span>ETA</span>
      <strong></strong>
    </div>
  </template>
  {{EMBEDDED_DATA}}
  <script>{{SCRIPT}}</script>
</body>
</html>
